[project]
name = "funscript"
version = "0.1.0"
description = "funscript 的可复现脚本环境依赖"
requires-python = ">=3.10"
dependencies = [
    "farfuntask>=0.0.7",
    "funfile>=1.0",
    "funpypi>=0.1",
    "funread>=0.1",
    "funsecret>=1.4",
    "funsecret-snapshot>=0.1",
    "fundrive>=1.2",
    "funbuild>=0.1",
    "requests-toolbelt>=1.0",
]

[tool.uv]
package = false
